<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento - Durand Tech System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{ --primary:#00D1FF; --primary2:#0A84FF; --primary-glow:rgba(0,209,255,0.3); --bg:#020208; --bg2:#080A14; --card:rgba(10,14,30,0.6); --card2:rgba(15,20,40,0.8); --border:rgba(0,209,255,0.12); --border2:rgba(0,209,255,0.3); --muted:#7A8AA0; --white:#E6F0FF; --grid:rgba(0,209,255,0.03); }
*{margin:0;padding:0;box-sizing:border-box}
body{ background:#020208; color:var(--white); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; position:relative }
body::before{ content:''; position:fixed; inset:0; background: radial-gradient(800px at 15% 20%, rgba(0,209,255,0.12), transparent 60%), radial-gradient(600px at 85% 80%, rgba(10,132,255,0.10), transparent 60%), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:auto, auto, 40px 40px, 40px 40px; pointer-events:none; z-index:0 }
.header{ height:72px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:rgba(2,2,8,0.8); backdrop-filter:blur(24px); position:sticky; top:0; z-index:10 }
.logo{ display:flex; align-items:center; gap:12px }
.logo-icon{ width:40px; height:40px; background:linear-gradient(135deg,var(--primary),var(--primary2)); border-radius:10px; display:grid; place-items:center; font-weight:800; color:#000; font-family:'JetBrains Mono'; box-shadow:0 0 20px var(--primary-glow); font-size:16px }
.logo-text{ line-height:1 }
.logo-text b{ font-size:14px; letter-spacing:1px; display:block; font-weight:800; color:#fff }
.logo-text span{ font-size:9px; letter-spacing:3px; color:var(--primary); font-family:'JetBrains Mono'; font-weight:700 }
.header-right{ display:flex; gap:10px; align-items:center; font-family:'Inter'; font-size:12px }
.pill{ background:rgba(0,209,255,0.06); border:1px solid var(--border); padding:7px 14px; border-radius:20px; color:var(--muted); font-weight:500; font-family:'JetBrains Mono'; font-size:11px }
.progress-line{ height:1px; background:rgba(255,255,255,0.06); width:100%; position:relative; z-index:1 }
.progress-fill{ height:2px; background:linear-gradient(90deg,var(--primary),var(--primary2)); width:100%; box-shadow:0 0 20px var(--primary); transition:width 0.5s; margin-top:-1px }
.container{ max-width:1200px; margin:0 auto; display:grid; grid-template-columns:1.2fr 0.8fr; gap:32px; padding:48px 24px; position:relative; z-index:1 }
@media(max-width:900px){ .container{ grid-template-columns:1fr } .side{ order:-1 } }
.step-label{ font-family:'JetBrains Mono'; font-size:11px; letter-spacing:3px; color:var(--primary); margin-bottom:24px; display:flex; align-items:center; gap:12px; font-weight:700 }
.step-label::after{ content:''; height:1px; flex:1; background:linear-gradient(90deg,var(--border2),transparent) }
.percent{ font-family:'JetBrains Mono'; font-size:11px; color:var(--muted) }
h1{ font-size:56px; line-height:0.90; letter-spacing:-3px; margin-bottom:16px; font-weight:900; font-family:'Plus Jakarta Sans'; color:#fff }
h1 span{ background:linear-gradient(135deg,var(--primary),var(--primary2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent }
.sub{ font-family:'JetBrains Mono'; font-size:12px; color:var(--muted); margin-bottom:32px; letter-spacing:0.5px }
.options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:480px }
@media(max-width:500px){ .options{ grid-template-columns:1fr } }
.opt{ background:rgba(10,14,30,0.4); border:1px solid var(--border); padding:18px; border-radius:12px; text-align:center; cursor:pointer; font-size:13px; color:#8A9AB0; transition:0.25s; font-weight:500; backdrop-filter:blur(10px); position:relative; overflow:hidden }
.opt::before{ content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(0,209,255,0.05), transparent); opacity:0; transition:0.25s }
.opt:hover{ border-color:var(--border2); color:var(--white); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.4), 0 0 20px rgba(0,209,255,0.1) }
.opt:hover::before{ opacity:1 }
.opt.selected{ background:linear-gradient(135deg, rgba(0,209,255,0.15), rgba(10,132,255,0.12)); border-color:var(--primary); color:#fff; box-shadow:0 0 30px rgba(0,209,255,0.2) inset, 0 0 20px rgba(0,209,255,0.15); font-weight:700 }
.btns{ display:flex; gap:12px; margin-top:28px }
.btn-back{ background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--muted); padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'JetBrains Mono'; font-size:12px; font-weight:600; transition:0.2s; letter-spacing:1px }
.btn-back:hover{ color:#fff; border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.05) }
.input-box{ max-width:480px; position:relative }
.input-box input{ width:100%; background:rgba(10,14,30,0.5); border:1px solid var(--border); padding:18px 20px; border-radius:12px; color:#fff; font-size:16px; outline:none; font-family:'Inter'; transition:0.2s; backdrop-filter:blur(10px) }
.input-box input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,209,255,0.12), 0 0 20px rgba(0,209,255,0.15); background:rgba(10,14,30,0.7) }
.input-box input::placeholder{ color:#5A6A80 }
.side{ background:rgba(10,14,30,0.5); border:1px solid var(--border); border-radius:20px; padding:24px; height:fit-content; position:sticky; top:100px; backdrop-filter:blur(20px); box-shadow:0 20px 60px rgba(0,0,0,0.5) }
.side-title{ font-family:'JetBrains Mono'; font-size:10px; letter-spacing:3px; color:var(--muted); margin-bottom:20px; display:flex; align-items:center; gap:8px; font-weight:700 }
.side-title i{ width:6px; height:6px; background:var(--primary); border-radius:50%; box-shadow:0 0 10px var(--primary); display:inline-block; animation:pulse 2s infinite }
@keyframes pulse{ 0%{opacity:1; box-shadow:0 0 10px var(--primary)} 50%{opacity:0.6; box-shadow:0 0 20px var(--primary)} 100%{opacity:1; box-shadow:0 0 10px var(--primary)} }
.row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px }
.row span:first-child{ font-family:'JetBrains Mono'; font-size:10px; color:#5A6A80; text-transform:uppercase; letter-spacing:1px; margin-top:2px; font-weight:600 }
.row span:last-child{ font-weight:600; color:#E6F0FF; text-align:right; max-width:60%; overflow:hidden; text-overflow:ellipsis }
.btn-whats{ width:100%; background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#000; border:none; padding:16px; border-radius:12px; font-weight:800; font-size:14px; cursor:pointer; margin-top:20px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 0 30px var(--primary-glow); transition:0.25s; font-family:'Inter'; letter-spacing:0.5px }
.btn-whats:hover{ transform:translateY(-2px); box-shadow:0 0 40px rgba(0,209,255,0.5), 0 8px 30px rgba(0,0,0,0.4); filter:brightness(1.1) }
.hint{ font-family:'JetBrains Mono'; font-size:10px; color:#5A6A80; text-align:center; margin-top:10px }
.alert{ background:rgba(0,209,255,0.05); border:1px solid rgba(0,209,255,0.15); border-radius:12px; padding:14px; margin-top:20px; display:flex; gap:10px; font-size:12px; line-height:1.5; color:#8A9AB0 }
.alert b{ color:var(--primary) }
.previa{ margin-top:32px; border-top:1px solid rgba(255,255,255,0.06); padding-top:20px }
.previa-title{ font-family:'JetBrains Mono'; font-size:10px; letter-spacing:2px; color:#5A6A80; margin-bottom:12px; font-weight:700 }
.previa-box{ background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:12px; padding:14px; font-family:'JetBrains Mono'; font-size:11px; color:#7A8AA0; line-height:1.6; white-space:pre-line; min-height:100px; backdrop-filter:blur(5px) }

</style>
</head>
<body>
<div class="header">
<div class="logo"><div class="logo-icon">DT</div><div class="logo-text"><b>DURAND TECH</b><span>DESENVOLVIMENTO</span></div></div>
<div class="header-right"><a href="index.html" style="background:var(--neon);color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:12px">← Voltar ao Site</a><div class="pill">(53) 99707-3648</div><div class="pill">PIX durandtechsysten@gmail.com</div></div>
</div>
<div class="progress-line"><div class="progress-fill" id="progress"></div></div>

<div class="container">
<div class="main">
<div class="step-label"><span id="stepLabel">07 / 07</span> <span class="percent" id="percent">100%</span></div>
<div id="questionArea"></div>
<div class="btns"><button class="btn-back" onclick="prev()">Voltar</button></div>
<div class="previa">
<div class="previa-title">PRÉVIA DA MENSAGEM</div>
<div class="previa-box" id="previaBox"></div>
</div>
</div>

<div class="side">
<div class="side-title"><i></i> RESUMO • AO VIVO</div>
<div id="resumo"></div>
<button class="btn-whats" onclick="enviar()"><span>◉</span> Enviar para Orçamento via WhatsApp</button>
<div class="hint">• abre no WhatsApp com mensagem pronta</div>
<div class="alert"><span>⚡</span><span><b>Resposta em até 2h</b> úteis. Sem ligação, sem spam. Direto no WhatsApp.</span></div>
</div>
</div>

<script>
const WHATSAPP = '5553997073648';
const steps = [
{ id:'nome', q:'Qual seu nome?', type:'text', placeholder:'Ex: Otavio Renan' },
{ id:'empresa', q:'Qual sua empresa?', type:'text', placeholder:'Ex: Joalheria Silva' },
{ id:'whatsapp', q:'Seu WhatsApp para contato?', type:'text', placeholder:'Ex: 53991458797' },
{ id:'projeto', q:'Qual projeto você precisa?', type:'options', options:['Site R$ 497','Site R$ 997','CondoManager R$ 135/mês','CondoManager R$ 847/ano','CondoManager Vitalício R$ 3500','App / Sistema','Outro'] },
{ id:'logo', q:'Você já tem logo?', type:'options', options:['Sim','Não','Preciso criar'] },
{ id:'prazo', q:'Qual seu prazo?', type:'options', options:['Urgente','7 dias','15 dias','30 dias','Sem pressa'] },
{ id:'origem', q:'Como nos conheceu?', type:'options', options:['Instagram','Indicação','Google','WhatsApp','Outro'] }
];
let data = {};
let current = 0;
// se veio tipo da index, já pula para o primeiro campo vazio após projeto
function getFirstEmptyIndex(){
  for(let i=0;i<steps.length;i++){
    if(!data[steps[i].id]) return i;
  }
  return steps.length-1;
}


// --- INTEGRAÇÃO INDEX + WIDGET: aceita ?tipo=xxx ---
(function(){
  try{
    const params = new URLSearchParams(window.location.search);
    const tipo = params.get('tipo');
    if(tipo){ data['projeto'] = tipo; }
    const projetoNome = params.get('projeto');
    if(projetoNome){ data['projeto'] = projetoNome; }
    // se projeto já veio preenchido, já posiciona no próximo vazio
    if(data['projeto']){ current = 4; // depois de projeto, vai para logo (evita ficar preso)
      // ajusta dinamicamente para primeiro vazio real
      setTimeout(()=>{ current = getFirstEmptyIndex(); render(); },0);
    }
  }catch(e){}
})();


function render(){
const step = steps[current];
document.getElementById('stepLabel').textContent = `0${current+1} / 0${steps.length}`;
document.getElementById('percent').textContent = Math.round(((current+1)/steps.length)*100)+'%';
document.getElementById('progress').style.width = ((current+1)/steps.length*100)+'%';
let html = `<h1>${getTitle(step.q)}</h1><div class="sub">Pressione Enter ↵ para continuar</div>`;
if(step.type==='text'){
html += `<div class="input-box"><input id="field" value="${data[step.id]||''}" placeholder="${step.placeholder}" onkeydown="if(event.key==='Enter') next()" /></div>`;
} else {
html += `<div class="options">` + step.options.map(o=>`<div class="opt ${data[step.id]===o?'selected':''}" onclick="selectOpt('${o.replace(/'/g,"\'")}')">${o}</div>`).join('') + `</div>`;
}
document.getElementById('questionArea').innerHTML = html;
if(step.type==='text') setTimeout(()=>document.getElementById('field')?.focus(),100);
updateResumo();
}
function getTitle(q){
if(q.includes('conheceu')) return 'Como nos <span>conheceu?</span>';
return q.replace('?','<span>?</span>');
}
function selectOpt(val){
const id = steps[current].id;
data[id]=val;
document.addEventListener('DOMContentLoaded', ()=>{ render(); });
// fallback immediate if already loaded
if(document.readyState !== 'loading') render();
setTimeout(()=> next(), 300);
}
function next(){
if(current < steps.length-1){ 
if(steps[current].type==='text'){
const v = document.getElementById('field')?.value.trim();
if(v) data[steps[current].id]=v;
}
current++; document.addEventListener('DOMContentLoaded', ()=>{ render(); });
// fallback immediate if already loaded
if(document.readyState !== 'loading') render(); 
} else { enviar(); }
}
function prev(){
if(current>0){ current--; document.addEventListener('DOMContentLoaded', ()=>{ render(); });
// fallback immediate if already loaded
if(document.readyState !== 'loading') render(); }
}
function updateResumo(){
const map = { nome:'NOME', empresa:'EMPRESA', whatsapp:'WHATSAPP', projeto:'PROJETO', logo:'LOGO', prazo:'PRAZO', origem:'ORIGEM' };
let html='';
for(let k in map){
html+=`<div class="row"><span>${map[k]}</span><span>${data[k]||'-'}</span></div>`;
}
document.getElementById('resumo').innerHTML = html;
let previa = `Nome: ${data.nome||'-'}\nEmpresa: ${data.empresa||'-'}\nWhatsApp: ${data.whatsapp||'-'}\nProjeto: ${data.projeto||'-'}\nLogo: ${data.logo||'-'}\nPrazo: ${data.prazo||'-'}\nOrigem: ${data.origem||'-'}`;
document.getElementById('previaBox').textContent = previa;
}
function enviar(){
const msg = `Olá Durand Tech! 🚀%0A%0A*ORÇAMENTO NOVO - FORMULÁRIO SITE*%0A%0A👤 Nome: ${data.nome}%0A🏢 Empresa: ${data.empresa}%0A📱 WhatsApp: ${data.whatsapp}%0A💼 Projeto: ${data.projeto}%0A🎨 Logo: ${data.logo}%0A⏰ Prazo: ${data.prazo}%0A🔍 Origem: ${data.origem}%0A%0AVim pelo formulário do site: durandtechsysten.com.br/orcamento.html`;
window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
}
document.addEventListener('DOMContentLoaded', ()=>{ render(); });
// fallback immediate if already loaded
if(document.readyState !== 'loading') render();
// permite salvar dados ao digitar
document.addEventListener('input', e=>{
if(e.target.id==='field'){
data[steps[current].id]=e.target.value;
updateResumo();
}
});
</script>
</body>
</html>
