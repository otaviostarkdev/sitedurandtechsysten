    setTimeout(()=>startFlow(),300);
  }
}
function addBotMsg(t,delay=0){
  setTimeout(()=>{
    const m=document.getElementById('chatMessages');
    if(!m) return;
    const d=document.createElement('div');d.className='msg bot';d.innerHTML=t;
    m.appendChild(d);m.scrollTop=m.scrollHeight;
  },delay);
}
function addUserMsg(t){
  const m=document.getElementById('chatMessages');
  if(!m) return;
  const d=document.createElement('div');d.className='msg user';d.textContent=t;
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}
function setQuickButtons(btns){
  const g=document.getElementById('qGrid');if(!g) return;g.innerHTML='';
  btns.forEach(b=>{
    const el=document.createElement('button');el.className='chat-qbtn'+(b.primary?' primary':'');el.textContent=b.label;el.onclick=()=>{sendQuick(b.value||b.label)};
    g.appendChild(el);
  });
}
function updateProgress(p){const el=document.getElementById('progressBar');if(el) el.style.width=p+'%';}
function startFlow(){
  updateProgress(15);
  addBotMsg('Olá! Eu sou o <b>Otávio Renan</b> 💚<br>Seu representante oficial Ton em Pelotas, atendo todo Brasil.<br><br>Vi que você quer uma maquininha <b>com taxas menores.<br>Eu tenho a Ton,<br>com taxa a partir de 0.57% no DÉBITO,<br> com frete grátis. Me conta, você é?<b>');
  setQuickButtons([
    {label:'👏 Sou comerciante',value:'Sou comerciante'},
    {label:'🚀 Sou autônomo',value:'Sou autônomo'},
    {label:'🏢 Sou empresário',value:'Sou empresário'},
    {label:'✍ Digite seu nome',value:'Digite seu nome'}
  ]);
  stage='categoria';
}
function sendQuick(t){const inp=document.getElementById('chatInput');if(inp) inp.value=t;sendChat();}
function askCity(){
  addBotMsg('Legal, <b>'+sanitize(lead.nome)+'</b>! Você é de qual cidade? 📍',400);
  setTimeout(()=>{
    setQuickButtons([
      {label:'📍 Pelotas',value:'Pelotas'},
      {label:'📍 Porto Alegre',value:'Porto Alegre'},
      {label:'📍 São Paulo',value:'São Paulo'},
      {label:'📍 Rio de Janeiro',value:'Rio de Janeiro'},
      {label:'🌎 Outra cidade',value:'Outra cidade'}
    ]);
  },500);
  stage='cidade';
}
function askModel(){
  addBotMsg('Perfeito! Atendo <b>'+sanitize(lead.cidade)+'</b> com frete grátis e ativação na hora. ✅<br><br><b>Qual modelo você quer garantir com 0,57% hoje?</b><br><small>Todas sem aluguel nunca!</small>',400);
  setTimeout(()=>{
    setQuickButtons([
      {label:'💳 T1 - Essencial',value:'T1'},
      {label:'🔥 T2+ - Mais Vendida',value:'T2+',primary:true},
      {label:'🤖 T3 Smart Android',value:'T3 Smart'}
    ]);
  },600);
  stage='modelo';
}
function sendChat(){
  const input=document.getElementById('chatInput');
  if(!input) return;
  const texto=input.value.trim();
  if(!texto) return;
  const low=texto.toLowerCase();
  if(low==='abrir_anexo' || low.includes('anexar comprovante')){
    input.value='';
    const inp=document.getElementById('comprovanteInput');
    if(inp) inp.click();
    return;
  }
  if(low==='confirmar_envio_comprovante' || low.includes('enviar pra otavio')){
    input.value='';
    confirmarEnvioComprovante();
    return;
  }
  if(low==='obrigado_otavio' || low.includes('obrigado, otavio') || low.includes('obrigado otavio')){
    addUserMsg(texto);input.value='';handleObrigadoOtavio();return;
  }
  if(low.includes('falar com otavio')){
    addUserMsg(texto);input.value='';
    window.open('https://wa.me/'+CONFIG.otavioWhatsApp+'?text=Oi Otávio, sou '+encodeURIComponent(lead.nome||'cliente')+' do site, já garanti minha '+encodeURIComponent(lead.modelo||'Ton')+' e quero confirmar','_blank');
    return;
  }
  if(low.includes('já garanti') || low.includes('ja garanti') || low.includes('garanti minha ton')){
    addUserMsg(texto);input.value='';handleJaGaranti();return;
  }
  if(low.includes('baixei o app') || low==='baixei_app'){
    addUserMsg(texto);input.value='';
    addBotMsg('Boa! Depois de enviar os docs, sua Ton <b>'+sanitize(lead.modelo||'')+'</b> será ativada com <b>taxa 0,57%</b>. Me avisa aqui quando liberar que eu confiro pra você! 💚',600);
    setQuickButtons([{label:'💬 Falar com Otávio',value:'falar_otavio'}]);
    return;
  }
  if(stage==='comprovante' && low.length>8 && !low.includes('anexar') && !low.includes('enviar')){
    addUserMsg(texto);input.value='';
    lead.comprovante=texto.substring(0,200);
    lead.status='COMPROVANTE_TEXTO';
    addBotMsg('✅ <b>Recebido, Ótimo! Anotei seu comprovante:</b><br>Já encaminhei pro Otávio no WhatsApp com todos os seus dados. Ele confirma em até 30 min! 💚',600);
    setQuickButtons([{label:'✅ Obrigado, Otávio!',value:'obrigado_otavio'}]);
    stage='pos_comprovante';
    salvarComprovanteNoSheets();
    notificarOtavioComprovante();
    return;
  }
  addUserMsg(texto);input.value='';
  if(stage==='categoria'){
    if(low.includes('digite seu nome')){
      addBotMsg('Pode digitar seu nome. 👇',400);
      stage='nome';setQuickButtons([]);return;
    }
    lead.categoria=texto;
    addBotMsg('Pode digitar seu nome. 👇',400);
    stage='nome';setQuickButtons([]);return;
  }
  if(stage==='nome'){
    lead.nome=texto;updateProgress(40);askCity();return;
  }
  if(stage==='cidade'){
    if(low.includes('outra cidade')){
      addBotMsg('Me diz de qual cidade e estado você é? Ex: Pelotas - RS 📍',400);
      stage='cidade_custom';setQuickButtons([]);return;
    }
    lead.cidade=texto;updateProgress(65);askModel();return;
  }
  if(stage==='cidade_custom'){
    lead.cidade=texto;updateProgress(65);
    addBotMsg('Que ótimo! Atendo em <b>todo o Brasil</b> 🚚✅<br>Inclusive em <b>'+sanitize(texto)+'</b> com <b>frete grátis</b> e ativação na hora!',600);
    setTimeout(()=>askModel(),800);return;
  }
  if(stage==='modelo'){
    lead.modelo=texto.includes('T3')?'T3 Smart':(texto.includes('T1')?'T1':'T2+');
    updateProgress(80);
    addBotMsg('Excelente escolha, <b>'+sanitize(lead.nome)+'</b>! A <b>'+sanitize(lead.modelo)+'</b> com <b>0,57%</b> é sucesso aqui em <b>'+sanitize(lead.cidade)+'</b>. Qual seu WhatsApp com DDD?',400);
    stage='whatsapp';return;
  }
  if(stage==='whatsapp'){
    let nums=texto.replace(/[^0-9]/g,'');
    if(nums.length<10){addBotMsg('Ops, número incompleto. Me manda com DDD: ex (53) 99183-3588');return;}
    lead.whatsapp=nums;updateProgress(90);
    addBotMsg('Fechado, '+sanitize(lead.nome)+'! Gerando seu link exclusivo da '+sanitize(lead.modelo)+'... ⏳',300);
    setTimeout(()=>fecharVenda(),1300);
    stage='final';return;
  }
}
async function salvarNoSheets(){
  const payload={
    nome:lead.nome||'',negocio:lead.categoria||'',volumeMensal:lead.cidade||'',
    modeloEscolhido:lead.modelo||'',whatsapp:lead.whatsapp||'',
    linkAfiliadoClicado:CONFIG.affiliateLinks[lead.modelo]||CONFIG.affiliateLinks['T2+'],
    dataCliente:lead.data||new Date().toLocaleString('pt-BR'),
    origem:lead.origem+' | Cidade: '+(lead.cidade||''),cidade:lead.cidade,
    evento:'LEAD_VENDA_TON_OTAVIO',link:CONFIG.affiliateLinks[lead.modelo]||''
  };
  lead.link=payload.linkAfiliadoClicado;
  try{await fetch(CONFIG.googleSheetsWebhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(e){}
}
function notificarOtavio(){
  const msg='🚀 *NOVA VENDA TON - SITE OTÁVIO*%0A%0A👤 *Nome:* '+encodeURIComponent(lead.nome)+'%0A🏷 *Categoria:* '+encodeURIComponent(lead.categoria)+'%0A📍 *Cidade:* '+encodeURIComponent(lead.cidade)+'%0A📱 *Modelo:* '+encodeURIComponent(lead.modelo)+'%0A📞 *WhatsApp Cliente:* '+encodeURIComponent(lead.whatsapp)+'%0A🔗 *Link:* '+encodeURIComponent(CONFIG.affiliateLinks[lead.modelo])+'%0A🕒 *Data:* '+encodeURIComponent(lead.data)+'%0A🌐 *Origem:* '+encodeURIComponent(lead.origem);
  window.open('https://wa.me/'+CONFIG.otavioWhatsApp+'?text='+msg,'_blank');
}
function showCheckoutButton(){
  const link=CONFIG.affiliateLinks[lead.modelo]||CONFIG.affiliateLinks['T2+'];
  lead.linkAfiliado=link;
  addBotMsg('✅ <b>LINK LIBERADO - TAXA 0,57% GARANTIDA!</b><br><br>👉 <a href="'+link+'" target="_blank" id="linkCheckoutOtavio" style="background:#00ff88;color:#000;padding:12px 20px;border-radius:24px;text-decoration:none;font-weight:900;display:inline-block;text-align:center;width:100%">GARANTIR MINHA '+sanitize(lead.modelo.toUpperCase())+' AGORA →</a><br><br><small>Checkout oficial Ton • Frete grátis • Suporte Otávio (53) 99183-3588<br>Link afiliado: Otávio Renan</small>',400);
  setTimeout(()=>{const win=window.open(link,'_blank');if(!win||win.closed||typeof win.closed=='undefined'){const a=document.getElementById('linkCheckoutOtavio');if(a){a.click();}}},1200);
  setTimeout(()=>{addBotMsg('👆 <b>Cliquei no botão acima</b> pra te levar pro checkout oficial da Ton com meu link de representante. Se não abriu automático, clica no botão verde aí em cima! 💚',1800);},2000);
}
async function fecharVenda(){
  updateProgress(100);await salvarNoSheets();
  addBotMsg('<b>'+sanitize(lead.nome)+'</b>, seu link da <b>'+sanitize(lead.modelo)+'</b> com <b>0,57%</b> está pronto! 🎉',400);
  showCheckoutButton();
  setTimeout(()=>{addBotMsg('Já avisei o Otávio. Se precisar, me chama direto: <b>(53) 99183-3588</b> 💚',1500);notificarOtavio();},2200);
  setQuickButtons([{label:'✅ Já garanti minha Ton'},{label:'❓ Falar com Otávio'}]);
}
function handleJaGaranti(){
  addBotMsg('🎉 <b>Parabéns pela compra!</b> Você fez uma ótima escolha!<br><br>📸 <b>Me envia aqui o comprovante do pagamento Pix</b> (foto ou código) pra eu liberar sua ativação com <b>prioridade máxima</b> e te acompanhar até chegar! 🚀<br><br><small>Clique no botão abaixo pra anexar 📎</small>',600);
  setQuickButtons([{label:'📎 Anexar comprovante',value:'abrir_anexo'},{label:'📞 Falar com Otávio',value:'falar_otavio'}]);
  criarInputComprovanteSeNaoExiste();
  stage='comprovante';
}
function criarInputComprovanteSeNaoExiste(){
  if(document.getElementById('comprovanteInput')) return;
  const fileInput=document.createElement('input');
  fileInput.type='file';fileInput.id='comprovanteInput';fileInput.accept='image/*,.pdf';fileInput.style.display='none';
  fileInput.onchange=async(e)=>{const file=e.target.files[0];if(!file) return;await processarComprovanteArquivo(file);};
  document.body.appendChild(fileInput);
}
async function processarComprovanteArquivo(file){
  comprovantePendente=file;
  const oldPrev=document.getElementById('previewComprovante');
  if(oldPrev) oldPrev.remove();
  if(file.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onload=function(e){
      const m=document.getElementById('chatMessages');
      const d=document.createElement('div');
      d.className='msg user';d.id='previewComprovante';
      d.innerHTML='<b>Comprovante anexado:</b> '+sanitize(file.name)+'<br><img src="'+e.target.result+'" style="max-width:100%;border-radius:8px;margin-top:6px">';
      m.appendChild(d);m.scrollTop=m.scrollHeight;
    };
    reader.readAsDataURL(file);
  }else{
    const m=document.getElementById('chatMessages');
    const d=document.createElement('div');
    d.className='msg user';d.id='previewComprovante';
    d.textContent='Comprovante anexado: '+file.name;
    m.appendChild(d);m.scrollTop=m.scrollHeight;
  }
  setTimeout(()=>{
    addBotMsg('👀 <b>Arquivo anexado!</b> Agora clique em <b>Enviar pra Otávio</b> pra eu mandar com todos os seus dados!',400);
    setQuickButtons([{label:'✅ Enviar pra Otávio',value:'confirmar_envio_comprovante',primary:true},{label:'🔄 Trocar arquivo',value:'abrir_anexo'}]);
  },400);
}
async function confirmarEnvioComprovante(){
  const file=comprovantePendente;
  if(!file){addBotMsg('Ops, não achei o arquivo. Clique em Anexar novamente.',400);return;}
  lead.comprovante=file.name+' ('+(file.size/1024).toFixed(0)+'KB)';
  lead.status='COMPROVANTE_ENVIADO';
  updateProgress(100);
  addBotMsg('✅ <b>Recebido, Ótimo! Anotei seu comprovante:</b> '+sanitize(lead.comprovante)+'<br><br>Já encaminhei pro Otávio no WhatsApp com todos os seus dados. Ele confirma em até 30 min! 💚',800);
  setQuickButtons([{label:'✅ Obrigado, Otávio!',value:'obrigado_otavio'}]);
  stage='pos_comprovante';
  await salvarComprovanteNoSheets();
  notificarOtavioComprovante();
  comprovantePendente=null;
}
function salvarComprovanteNoSheets(){
  const payload={
    nome:lead.nome||'',negocio:lead.categoria||'',volumeMensal:lead.cidade||'',
    modeloEscolhido:lead.modelo||'',whatsapp:lead.whatsapp||'',
    linkAfiliadoClicado:lead.link||CONFIG.affiliateLinks[lead.modelo]||'',
    dataCliente:lead.data||'',origem:'COMPROVANTE: '+(lead.comprovante||'')+' | '+lead.origem,
    evento:'COMPROVANTE_PIX_ENVIADO_OTAVIO',comprovante:lead.comprovante||'',status:lead.status||''
  };
  return fetch(CONFIG.googleSheetsWebhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
}
function notificarOtavioComprovante(){
  const msg='🧾 *COMPROVANTE PIX - SITE OTÁVIO*%0A%0A👤 *Cliente:* '+encodeURIComponent(lead.nome)+'%0A🏷 *Categoria:* '+encodeURIComponent(lead.categoria)+'%0A📍 *Cidade:* '+encodeURIComponent(lead.cidade)+'%0A📱 *Modelo:* '+encodeURIComponent(lead.modelo)+'%0A📞 *WhatsApp:* '+encodeURIComponent(lead.whatsapp)+'%0A🧾 *Comprovante:* '+encodeURIComponent(lead.comprovante||'')+'%0A🔗 *Link:* '+encodeURIComponent(lead.link||'')+'%0A🕒 *Data:* '+encodeURIComponent(lead.data)+'%0A%0A_Cliente enviou comprovante!_';
  window.open('https://wa.me/'+CONFIG.otavioWhatsApp+'?text='+msg,'_blank');
}
function handleObrigadoOtavio(){
  addBotMsg('Perfeito, <b>'+sanitize(lead.nome||'amigo(a)')+'</b>! 💚 Finaliza em 3 passos:<br><br><b>1⃣ BAIXE O APP TON</b><br>Play Store ou Apple Store > busque Ton<br><br><b>2⃣ CADASTRE SUA CHAVE PIX</b><br>App > Minha Conta > Receber com Pix<br><br><b>3⃣ ENVIE SEUS DOCUMENTOS</b><br>App > Enviar Documentos (RG/CNH + endereço)<br><br><a href="https://play.google.com/store/apps/details?id=br.com.stone.ton" target="_blank" style="background:#00ff88;color:#000;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:800;display:inline-block;margin:4px">📲 Play Store</a> <a href="https://apps.apple.com/br/app/ton/id1474435517" target="_blank" style="background:#00ff88;color:#000;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:800;display:inline-block;margin:4px">🍎 Apple Store</a>',800);
  setQuickButtons([{label:'📲 Baixei o app',value:'baixei_app'},{label:'💬 Falar com Otávio',value:'falar_otavio'}]);
  stage='final_instrucoes';
}
setTimeout(()=>{const b=document.getElementById('botBubble');if(b && !document.getElementById('chatPanel').classList.contains('open')){b.style.display='block';b.onclick=()=>toggleChat();}},2500);
setTimeout(()=>{const b=document.getElementById('botBubble');if(b) b.style.display='none';},9500);
</script>
