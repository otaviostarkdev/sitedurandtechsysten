<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durand Tech - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#080a12;overflow:hidden;position:relative;padding:20px}
.bg{position:absolute;inset:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.75;animation:float 14s ease-in-out infinite}
.orb1{width:500px;height:500px;background:#00E5FF;top:-120px;left:-120px}
.orb2{width:400px;height:400px;background:#8B5CF6;top:15%;right:-100px;animation-delay:-3s}
.orb3{width:600px;height:600px;background:#0EA5E9;bottom:-200px;left:25%;animation-delay:-6s;opacity:.5}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.08)}}
.card{position:relative;z-index:2;width:100%;max-width:420px;padding:42px 38px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.13);border-radius:24px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 20px 50px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.15)}
.logoWrap{display:flex;justify-content:center;margin-bottom:18px}
.logoWrap img{height:72px;width:auto;filter:drop-shadow(0 0 12px rgba(0,229,255,0.5))}
h1{color:#fff;font-weight:700;font-size:22px;letter-spacing:0.08em;text-align:center}
.sub{color:rgba(255,255,255,0.55);text-align:center;font-size:13px;margin-top:4px;letter-spacing:0.04em}
.form{margin-top:32px}
.inputBox{position:relative;margin-bottom:22px}
.inputBox input{width:100%;padding:15px 16px 15px 44px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;outline:none;color:#fff;font-size:14px;transition:.3s}
.inputBox input::placeholder{color:transparent}
.inputBox label{position:absolute;left:44px;top:15px;color:rgba(255,255,255,0.45);font-size:14px;pointer-events:none;transition:.3s}
.inputBox input:focus,.inputBox input:not(:placeholder-shown){border-color:#00E5FF;background:rgba(255,255,255,0.09);box-shadow:0 0 0 3px rgba(0,229,255,0.12)}
.inputBox input:focus+label,.inputBox input:not(:placeholder-shown)+label{top:-9px;left:12px;font-size:11px;background:#10121f;padding:0 6px;border-radius:4px;color:#00E5FF}
.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.35);font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0 26px;font-size:12px}
.row label{color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:6px;cursor:pointer}
.row a{color:rgba(255,255,255,0.6);text-decoration:none;transition:.2s}
.row a:hover{color:#00E5FF}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#00E5FF,#8B5CF6);color:#000;font-weight:700;font-size:15px;cursor:pointer;transition:.3s;letter-spacing:.02em}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,229,255,0.35)}
.foot{text-align:center;margin-top:28px;color:rgba(255,255,255,0.35);font-size:11px}
@media(max-width:440px){.card{padding:32px 24px}}
</style>
</head>
